[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advdefense"
version = "1.0.0"
description = "A comprehensive framework for evaluating adversarial robustness of deep learning models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Adversarial Defense Study Team"}
]
keywords = [
    "adversarial",
    "robustness",
    "deep-learning",
    "pytorch",
    "cifar10",
    "resnet",
    "vision-transformer"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "timm>=0.6.0",
    "numpy>=1.19.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "pandas>=1.3.0",
    "torchattacks>=3.4.0",
    "autoattack>=0.1",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
robustbench = [
    "robustbench>=1.1",
]
all = [
    "advdefense[dev]",
    "advdefense[robustbench]",
]

[project.scripts]
advdefense = "cli.main:cli"

[project.urls]
"Homepage" = "https://github.com/adversarial-defense-study"
"Bug Tracker" = "https://github.com/adversarial-defense-study/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
