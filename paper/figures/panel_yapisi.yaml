# Y3 sekil 9'un icinde (maskeler kumelere yazilir), Y8 sekil 12'nin icinde (ucuncu kart). Y6 ve Y9 eklenmez.
#
# 17 sekillik hedef dizi (metindeki yere gore):
#   1 karma | Y1 serit | 2 akis | Y2 serit | Y4 serit | Y5 akis | 3 serit | 4 serit | 5 renk | 6 yok |
#   7 serit | 8 renk | Y7 yok | 9 serit | 10 serit | 11 yok | 12 serit
#   en uzun ayni tur dizisi 2 (Y2-Y4, 3-4, 9-10); harfli pay 1/17 = 0.059 (harf kalirsa), 0/17 (kalmazsa); sinir 0.40.
