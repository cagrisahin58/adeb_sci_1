version: '3.8'
services:
  med-lab:
    image: nvcr.io/nvidia/pytorch:25.01-py3
    user: ubuntu
    working_dir: /workspace/adeb_sci_1
    volumes:
      - ..:/workspace/adeb_sci_1:cached
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
