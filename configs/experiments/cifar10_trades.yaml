# TRADES training experiment on CIFAR-10

name: "resnet18_trades"
seed: 42
device: "auto"

model: "resnet18"
model_args:
  num_classes: 10

data:
  dataset: "cifar10"
  data_dir: "./data"
  batch_size: 128

training:
  epochs: 25
  optimizer: "sgd"
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: "cosine"

defense:
  name: "trades"
  beta: 6.0
  attack:
    name: "pgd"
    eps: 0.031373
    alpha: 0.007843
    steps: 10

checkpoint:
  checkpoint_dir: "./models/resnet/trades"
  save_best: true
